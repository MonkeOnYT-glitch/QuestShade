; Found Footage - QuestShade original. Warm, blown-out "someone found this tape" look:
; huge glow off every light, amber tint, soft blacks, purple/green fringing and dark corners.
; Pairs well with Camera > Mode + view > Mode = Chest or Hand, and a wide field of view (~100).
[Color]
Exposure = 0.45
Contrast = 12
Saturation = -6
[WhiteBalance]
Temperature = 24
Tint = 4
[LiftGammaGain]
Lift = 1, 1, 1, 0.01
Gamma = 1.04, 1.02, 0.98, 0.08
Gain = 1.04, 1, 0.94, 0.1

; the blown-out glow
[Bloom]
Intensity = 1.4
Threshold = 0.66
SoftKnee = 0.7
Scatter = 0.85

; the lens: colour fringes, dark corners
[ChromaticAberration]
Intensity = 0.6
[Vignette]
Intensity = 0.3
Smoothness = 0.6

; soft focus and a little grit
[DepthOfField]
Strength = 0.7
[FilmGrain]
Intensity = 0.2
Response = 0.8
Size = 1.5

; stepping into light blows out harder than usual
[EyeAdaptation]
Strength = 1.1

; lens flare orbs + lens dirt (camera only: preview, photos, video; never your own view)
[LensFlare]
Intensity = 0.8
Spacing = 0.35
Halo = 0.5
Fringe = 0.6
[LensDirt]
Intensity = 0.6

; sun shafts through windows and doorways (your view and the camera)
[GodRays]
Intensity = 0.6
Length = 0.6
Threshold = 0.7
