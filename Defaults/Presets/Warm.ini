; Warm - golden-hour look.  Also shows how to use a LUT file.

[Color]
Contrast = 8
Saturation = 10

[WhiteBalance]
Temperature = 22
Tint = 4

[Vignette]
Intensity = 0.2
Smoothness = 0.4

; Drop a .cube (Resolve/Photoshop/Lightroom export) or ReShade-style lut.png strip
; into the LUTs folder and point File at it. It's resampled to the game's LUT size.
[LUT]
Enabled = false
File = MyLook.cube
Contribution = 1.0     ; 0..1 blend
FlipY = auto           ; png only: auto / true (ReShade layout) / false (Unity layout)
