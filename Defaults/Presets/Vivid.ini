; Vivid - punchy colour, works fully on Quest.
; Any section you leave out stays as the game/level set it.
; Add "Enabled = false" inside a section to switch just that effect off.

[Color]
Contrast = 12          ; -100 .. 100
Saturation = 22        ; -100 .. 100
HueShift = 0           ; -180 .. 180
ColorFilter = #FFFFFF  ; multiplies the image

[WhiteBalance]
Temperature = 4        ; -100 (cool) .. 100 (warm)
Tint = 0

[LiftGammaGain]
; r, g, b, offset   (1,1,1,0 = neutral)
Lift  = 1, 1, 1, -0.02
Gamma = 1, 1, 1, 0
Gain  = 1, 1, 1, 0.04

[Vignette]
Intensity = 0.18
Smoothness = 0.4
Color = #000000
