; =====================================================================
;  QuestShade - ReShade-style post-processing + in-game camera for BONELAB
;  Edit while the game runs: changes apply within ~2 seconds (HotReload).
;  Presets live in Presets\*.ini, LUTs (.cube / .png strips) in LUTs\.
; =====================================================================

[General]
Enabled = true
Preset = Vivid                 ; file name in Presets\ without .ini
HotReload = true
ReloadInterval = 2             ; seconds between file checks
ShowToasts = true              ; little text popup when you switch presets
AutoUpdate = true              ; download new QuestShade versions in the background (used from the next launch)
; Where a preset's [Bloom] and [DepthOfField] are used:
BloomDofEveryPreset = true     ; presets without their own [Bloom] / [DepthOfField] get a default one
BloomDofPhotosVideo = true     ; full quality on photos + recordings (no cost while playing)
BloomDofPreview = true         ; full quality on the camera's preview screen (small, cheap)
; Bloom / Tonemapping / ChromaticAberration / FilmGrain / LensDistortion / Exposure
; use shader variants BONELAB strips from its Quest build. They are skipped on Quest
; unless this is true (they then usually do nothing; Bloom also costs GPU).
AllowUnsupportedOnQuest = false

[Controls]
; Gestures: LeftStickHold, LeftStickDoubleTap, RightStickHold, RightStickDoubleTap,
;           BothSticks (click both thumbsticks together),
;           LeftGripStickHold, RightGripStickHold (hold grip + hold stick click), None
ToggleEffects = RightStickHold
NextPreset    = RightStickDoubleTap
PrevPreset    = None
ToggleCamera  = BothSticks
TakePhoto     = LeftStickDoubleTap   ; only while the camera is out
CameraMode    = LeftStickHold        ; Hand > Selfie > FirstPerson > Helmet > Chest > ThirdPerson (camera out)
HideCamera    = LeftGripStickHold    ; hide/show the camera body; it keeps recording (camera out)
Record        = RightGripStickHold   ; start/stop video recording (Quest)
; Holding the camera: squeeze grip on either handle. Then TAP trigger = photo, HOLD trigger = start / stop
; recording (a bar on the camera fills up while you hold). Let go and it stays in the air.
HoldTime = 0.6
DoubleTapTime = 0.35
Haptics = true
Keyboard = true                ; PC testing: F7 effects, F6/F8 preset, F9 camera, F10 photo, F11 mode, F12 hide, R record

[Camera]
; The camera is a real BONELAB item: grab it like any prop (needs BoneLib). Let go and it stays in mid-air.
PhysicalCamera = true
CameraModel = handheld         ; handheld = the two-handled rig (WideEye's design, orange), simple = flat screen
FreezeOnRelease = true         ; false = it drops / gets thrown like a normal object
BodyBarcode = c1534c5a-87ce-436d-b00c-ef9547726176   ; item used as the body (default: Gravity Cup, its look is hidden)
BodyMountHeight = 0.06         ; metres from the item's centre up to the screen
Mode = Hand                    ; Hand, Selfie, FirstPerson, Helmet, Chest, ThirdPerson
; Where photos go. auto = Quest: /sdcard/Oculus/Screenshots (Quest gallery), else
; Pictures/BONELAB, else DCIM/BONELAB, else UserData/QuestShade/Photos. PC: UserData.
SaveFolder = auto
ControlsLabel = true           ; text on the camera that says what the trigger does right now
Preview = true                 ; false = screen off, no preview rendering (saves GPU); photos/video still work
; Video: encoded like the Quest's own captures (HEVC + AAC, H.264 fallback). Saved to /sdcard/Oculus/VideoShots (Quest gallery).
RecordQuality = ultra          ; ultra = best your headset can record smoothly (Quest 3: 1080p, 3S/Pro: 720p, 2: 540p), or 480p/540p/720p/1080p
RecordFps = 30
RecordBitrate = auto           ; kbps, or auto = high quality (HEVC: 1080p 20000, 720p 12000, 540p 8000)
RecordSupersample = 1.0        ; 1.0 - 2.0 render scale (sharper, much heavier; capped to what the headset can take)
RecordGameAudio = true         ; the game's sound (copied straight off the game's audio output)
RecordMic = true               ; your microphone
; Crash guard: if a recording with audio ever crashes the game, that audio source is switched off automatically
; next time (with a message) instead of crashing again. Turn it back on to retry.
GameVolume = 1.0
MicVolume = 1.0
AudioBitrate = 128          ; kbps AAC (what Quest captures use)
ThirdPersonDistance = 1.6      ; metres behind your head
ThirdPersonHeight = 0.35
ThirdPersonSide = 0.35         ; + = right shoulder, - = left
; Chest mode = bodycam: rides your body's chest and turns with your torso, not your head.
ChestFieldOfView = 100         ; wide like a real bodycam (FieldOfView below is for the other modes)
ChestForward = 0.16            ; metres in front of the chest centre (clears your own body)
ChestHeight = 0                ; + = up toward the collarbone
ChestSide = 0                  ; + = right, - = left (real bodycams often sit off-centre)
ChestPitch = -5                ; degrees, - = tilted down
; Preview screen cost scales with PreviewWidth * PreviewHeight * PreviewFps.
; Defaults are tuned to be cheap on Quest 2/3.
PreviewWidth = 512
PreviewHeight = 288
PreviewFps = 24
PreviewShadows = false
PostProcessing = true          ; apply your preset to the camera too
; Photos are rendered once at this size when you press the shutter.
PhotoWidth = 1920
PhotoHeight = 1080
PhotoMSAA = 2                  ; 1, 2, 4, 8
PhotoShadows = true
FieldOfView = 60
FarClip = auto                 ; metres, or auto = same as your view (shorter cuts the sky off)
Smoothing = 0.12               ; 0 = raw hand motion, 0.1 = light stabiliser, 0.5 = floaty
ScreenSize = 0.16              ; preview height in metres
HandOffset = 0, 0.06, 0.10     ; x, y, z metres from the left controller
HandTilt = 25                  ; degrees
