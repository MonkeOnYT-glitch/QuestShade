; Limits Bodycam - QuestShade port of "Limit's Bodycam" (ReShade).
; Original: Fisheye (zoom 0.6, CA 0.017), Glitch, CRT, Cinetools LUT, FilmGrain, AmbientLight, sharpen.
; Ported: cool, slightly desaturated body-camera grade + heavy corner falloff.
; Tip: set the camera FieldOfView to ~100 and use FirstPerson mode for the bodycam feel.
[Color]
Contrast = 18
Saturation = -18
[WhiteBalance]
Temperature = -10
Tint = -3
[LiftGammaGain]
Lift  = 1, 1, 1, 0.02
Gain  = 1, 1, 1, 0.06
[Vignette]
Intensity = 0.42
Smoothness = 0.55

; Fisheye + fringing + grain + glitch (all run on Quest)
[LensDistortion]
Intensity = 0.35
Scale = 0.88
[ChromaticAberration]
Intensity = 0.35
[FilmGrain]
Intensity = 0.5
Response = 0.7
Size = 1.2
[Glitch]
Amount = 0.1
Rows = 50
Speed = 10
[Sharpen]
Amount = 0.4