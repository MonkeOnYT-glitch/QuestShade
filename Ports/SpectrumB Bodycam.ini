; SpectrumB Bodycam - QuestShade port of the ReShade preset.
; Original: AmbientLight (strength 13.7, lens + dirt), BloomingHDR (auto exposure, +25% saturation),
; HexLensFlare, CAS sharpen 1.0, qUINT ADOF (autofocus, radius 20.5).
; Ported: heavy light glow, eyes that adjust to the dark, punchy colour, crisp detail, autofocus blur, flares and lens dirt.
; Not on Quest: SuperDepth3D (it only shows info in the original).
[Color]
Contrast = 10
Saturation = 25

; AmbientLight lifts the whole picture a little
[LiftGammaGain]
Lift = 1, 1, 1, 0.01
Gain = 1, 1, 1, 0.04

; AmbientLight (strength 13.7) + BloomingHDR (spread 1.0)
[Bloom]
Intensity = 1.5
Threshold = 0.6
SoftKnee = 0.6
Scatter = 0.8

; BloomingHDR auto exposure (seek 0.5)
[EyeAdaptation]
Strength = 1.0

; CAS (sharpening 1.0)
[Sharpen]
Amount = 0.6

; qUINT ADOF: autofocus on the middle, hexagon bokeh
[DepthOfField]
Strength = 1.0
FocusDistance = 0
AutofocusCenter = 0.5, 0.5
AutofocusRadius = 0.6
MaxBlur = 20.5
FarCurve = 1.5
NearCurve = 6
BokehIntensity = 0.3

; HexLensFlare (intensity 0.117, scale 0.9) + AmbientLight lens and dirt (camera only)
[LensFlare]
Intensity = 0.7
Spacing = 0.35
Halo = 0.4
Fringe = 0.5
[LensDirt]
Intensity = 1.0
