; Limits Security Footage - QuestShade port of "Limits' Security Footage" (ReShade).
; Original: RetroTV 320x240 + RF noise, CRT scanlines, Glitch, auto exposure, BloomingHDR contrast 1.33.
; Ported: the washed CCTV colour, contrast and tube vignette. Scanlines/glitch/low-res need ReShade.
[Color]
Contrast = 30
Saturation = -55
ColorFilter = #E6F2EC
[LiftGammaGain]
Lift  = 1, 1, 1, 0.03       ; milky blacks like cheap CCTV
Gain  = 0.96, 1.04, 0.98, -0.02
[Vignette]
Intensity = 0.45
Smoothness = 0.35
Rounded = true

; Retro CCTV stack (all run on Quest in the single final pass)
[Scanlines]
Intensity = 0.25
Count = 240
Speed = 0.3
RollingBar = 1
[Noise]
Intensity = 0.25
[Glitch]
Amount = 0.08
Rows = 40
Speed = 8
[CRT]
Curvature = 0.25
[ChromaticAberration]
Intensity = 0.25