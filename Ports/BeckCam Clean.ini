; BeckCam - Clean - QuestShade port of the ReShade preset (same settings as the built-in "Clean Cam").
; Real-camera feel without a colour tint: big soft glow off lights, eyes that adjust to dark rooms,
; crisp sharpened detail, a strong colour fringe toward the edges and a hard dark frame edge.
; Not on Quest: motion blur and the screen-space GI / ambient occlusion (shadows are darkened a little instead).
[Color]
Contrast = 12
Saturation = 8

; LSPO irradiance (fake GI / AO) -> slightly deeper shadows
[LiftGammaGain]
Lift = 1, 1, 1, -0.03
Gain = 1, 1, 1, 0.03

; AmbientLight (strength 7.7, adaptive) + PPFX Bloom (threshold 0.4, radius 32)
[Bloom]
Intensity = 1.3
Threshold = 0.5
SoftKnee = 0.6
Scatter = 0.8

; EyeAdaption (strength 2)
[EyeAdaptation]
Strength = 1.2

; CAS (sharpening 3.0) + Quark local contrast
[Sharpen]
Amount = 0.7

; prod80 chromatic aberration (strength 0.94, wide)
[ChromaticAberration]
Intensity = 0.55

; ArtisticVignette: black, hard edge right at the frame border
[Vignette]
Intensity = 0.32
Smoothness = 0.35

; lens flare orbs + lens dirt (camera only: preview, photos, video; never your own view)
[LensFlare]
Intensity = 0.9
Spacing = 0.35
Halo = 0.5
Fringe = 0.6
[LensDirt]
Intensity = 0.8
