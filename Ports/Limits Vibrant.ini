; Limits Vibrant - QuestShade port of "Limits' Vibrant" (ReShade).
; Original: AmbientLight glow + BloomingHDR (+25% saturation) + CAS sharpen + lens flare + DOF.
; Ported: the colour/brightness character. Sharpen, flares and DOF need ReShade-only shaders.
[Color]
Contrast = 16
Saturation = 40
[LiftGammaGain]
Lift  = 1, 1, 1, 0.01        ; AmbientLight lifts the image slightly
Gamma = 1, 1, 1, 0.03
Gain  = 1.02, 1.0, 0.98, 0.05
[WhiteBalance]
Temperature = 5

; ReShade CAS equivalent (runs on Quest)
[Sharpen]
Amount = 0.45